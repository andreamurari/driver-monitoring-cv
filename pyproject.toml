[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dms"
version = "0.1.0"
description = "Driver monitoring: distraction classification and detection on State Farm"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "matplotlib",
  "pillow",
  "pyyaml",
]

[project.optional-dependencies]
# Day 2 onwards; install on Kaggle/Colab with the versions of the cloud environment
train = ["torch", "torchvision", "timm", "tensorboard"]
dev = ["pytest", "ruff", "kaggle", "six"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
