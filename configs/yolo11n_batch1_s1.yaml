# Day 8: batch-1 model (yolo11n.yaml) with seed 1, trained on batch 1 only, tested on the clean test
name: yolo11n_batch1_s1
model: models/yolo11n.pt   # downloaded by Ultralytics on first use
data: data/yolo_upto_b1/data.yaml  # python scripts/batch_data.py --upto 1

train:                     # arguments passed to YOLO.train()
  epochs: 60
  patience: 15             # stop if validation mAP does not improve for 15 epochs
  imgsz: 640               # original image width: no downscaling
  batch: 8
  workers: 2
  device: cpu
  seed: 1
  deterministic: true
  fliplr: 0.5              # flip is safe: the classes do not depend on the side
